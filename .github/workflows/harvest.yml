name: Harvest ETD Abstracts

on:
  workflow_dispatch:
    inputs:
      api_delay:
        description: 'Delay in milliseconds between API requests (100–10000)'
        type: number
        default: 1000

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run harvest script
        env:
          API_DELAY: ${{ github.event.inputs.api_delay || '1000' }}
        run: node scripts/harvest.js

      - name: Check for data changes and commit
        if: success()
        run: |
          git diff --quiet data/word_frequencies.json || {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update word frequency data"
            git push
          }
